<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Planner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* CSS Variables for Easy Switching */
        :root[data-theme="dark"] {
            --bg-color: #0f172a; /* Deep Navy Dark */
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc; /* Clean Light Gray */
            --text-color: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease; /* Smooth transition */
            min-height: 100vh;
            padding-top: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-color);
        }

        /* Theme Toggle Button Style */
        .theme-switch {
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            background: var(--glass-bg);
            color: var(--text-color);
            font-size: 14px;
        }
    </style>
</head>
<body data-theme="dark">

    <nav class="container mb-4 d-flex justify-content-between align-items-center">
        <a href="/" class="h4 fw-bold text-decoration-none" style="color: #38bdf8;">⚡ AI Planner</a>
        
        <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">
            <i data-lucide="moon" class="me-2 size-4"></i> Dark Mode
        </button>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-theme', 'light');
                btn.innerHTML = '<i data-lucide="sun" class="me-2 size-4"></i> Light Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.innerHTML = '<i data-lucide="moon" class="me-2 size-4"></i> Dark Mode';
            }
            lucide.createIcons(); // Refresh icons
        }

        lucide.createIcons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
